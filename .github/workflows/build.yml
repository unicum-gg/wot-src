name: build

# Rebuilds the decompiled sources from the live client and pushes what changed.
# Scheduled workflows only run from the default branch, which is why this lives
# on `main` while the content branches carry the output.
#
# Needs the `SYNC_PAT` secret (fine-grained PAT, Contents: write) for the same
# reason `sync-upstream.yml` does: the org disables write for GITHUB_TOKEN.
on:
  schedule:
    - cron: "0 5 * * *" # daily, after the upstream sync window
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

env:
  # Pinned on purpose. A newer uncompyle6 mangles nested dict comprehensions,
  # and ffdec past 14.4.0 reorders SWF metadata and rewrites boolean coercions,
  # so either one would make our output drift from upstream's.
  UNCOMPYLE6_VERSION: "3.8.0"
  FFDEC_VERSION: "14.4.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 1 # each job pulls several GB, keep them sequential
      matrix:
        include:
          - branch: EU
            host: wgus-woteu.wargaming.net
            guid: WOT.EU.PRODUCTION
          - branch: NA
            host: wgus-wotna.wargaming.net
            guid: WOT.NA.PRODUCTION
          - branch: ASIA
            host: wgus-wotasia.wargaming.net
            guid: WOT.ASIA.PRODUCTION
          - branch: CT
            host: wgus-wotct.wargaming.net
            guid: WOT.CT.PRODUCTION
          # Мир танков, published by Lesta on its own update service since
          # Wargaming left Russia. Same protocol, different host and app tag:
          # the guid came out of the launcher's embedded gc_info.xml.
          - branch: RU
            host: lstus-ru.lesta.ru
            guid: MT.RU.PRODUCTION

    steps:
      - name: Checkout generator (main)
        uses: actions/checkout@v4
        with:
          # The PAT belongs here, not at push time: checkout stores credentials
          # as an `http.<host>.extraheader`, and that Authorization header wins
          # over anything put in the remote URL. Setting the URL later left git
          # pushing as github-actions[bot], which the org denies write to.
          token: ${{ secrets.SYNC_PAT }}

      # The two delta formats the incremental patches ship their packages as:
      # `.xdiff` is VCDIFF, decoded by xdelta3, and `.rdiff` is librsync, whose
      # decoder is packaged as `rdiff` (`librsync-bin` installs no binary).
      - name: Install extraction tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full xdelta3 rdiff

      # A package is held on disk three times at its widest (the archive, the
      # patched copy, the unpacked contents), and the largest are several GB.
      # The runner's stock image leaves too little room for that.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # uncompyle6 3.8.0 does not run on a modern interpreter, and the patch
      # level matters too: its `xdis` dependency keys opcode tables by exact
      # version, so "3.9" resolving to 3.9.25 dies with KeyError: '3.9.25'.
      # 3.9.16 is the newest release xdis 6.0.5 has a table for that the runner
      # image still ships, so the pin cannot drift into that error again.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9.16"

      - run: npm ci --no-audit --no-fund

      - name: Install decompilers
        run: |
          python -m pip install --quiet "uncompyle6==${UNCOMPYLE6_VERSION}" polib
          mkdir -p tools/ffdec
          curl -sL "https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version${FFDEC_VERSION}/ffdec_${FFDEC_VERSION}.zip" -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d tools/ffdec

      # Fail in seconds rather than after half an hour of extraction if the
      # interpreter and the decompiler disagree. Importing `main` is where a
      # mismatched interpreter blows up (xdis resolves the host version there),
      # and the scanner is what the run actually needs: the client's bytecode is
      # Python 2.7, which this interpreter cannot compile, so the check loads
      # that table rather than round-tripping a file it would have to build.
      - name: Check the decompiler runs
        run: |
          python - <<'SMOKE'
          import sys
          from uncompyle6.main import decompile_file  # noqa: F401
          from uncompyle6.scanner import get_scanner
          scanner = get_scanner("2.7")
          print("uncompyle6 on %s reads %d 2.7 opcodes" % (sys.version.split()[0], len(scanner.opc.opname)))
          SMOKE

      - name: Prepare branch worktree
        run: |
          git config user.name "wot-src build"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "${{ matrix.branch }}" >/dev/null; then
            git fetch --depth 1 origin "${{ matrix.branch }}"
            git worktree add out "origin/${{ matrix.branch }}"
          else
            git worktree add --orphan -b "${{ matrix.branch }}" out
          fi

      - name: Generate (no-op if the client version is unchanged)
        env:
          WOTSRC_PYTHON: python
          WOTSRC_FFDEC_JAR: tools/ffdec/ffdec.jar
        run: npm run generate -- --host "${{ matrix.host }}" --guid "${{ matrix.guid }}" --out out

      - name: Commit & push if changed
        working-directory: out
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no changes for ${{ matrix.branch }}"
            exit 0
          fi
          git commit -m "🍱 update ${{ matrix.branch }} sources to $(cat .version_name)"
          git push origin "HEAD:${{ matrix.branch }}"
