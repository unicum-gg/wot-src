name: assets

# Rebuilds the vehicle icons of `unicum-gg/wot.assets` from the live client and
# pushes what changed. That repo is a fork of Kurzdor/wot.assets, kept
# fast-forwarded by its own sync, and upstream's test branch froze in July 2026:
# a Common Test vehicle then has no picture anywhere, because Wargaming's public
# CDN serves released vehicles only. So we build that branch ourselves.
#
# Only `gui/maps/icons/vehicle/**` is mirrored, not upstream's whole 21 GB `gui`
# tree, which no runner can hold.
#
# All four branches are built here, so wot.assets' own `sync-upstream` workflow
# is deleted: a branch cannot be both fast-forwarded from upstream and written
# to by us, and the fast-forward is what would break.
on:
  schedule:
    - cron: "30 5 * * *" # daily, just after the sources build
  workflow_dispatch:

concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # The four branches upstream carries, each rebuilt from its own client.
          - branch: WG
            host: wgus-woteu.wargaming.net
            guid: WOT.EU.PRODUCTION
          - branch: WG_CT
            host: wgus-wotct.wargaming.net
            guid: WOT.CT.PRODUCTION
          - branch: Lesta
            host: lstus-ru.lesta.ru
            guid: MT.RU.PRODUCTION
          - branch: Lesta_PT
            host: lstus-ru.lesta.ru
            guid: MT.PT.PRODUCTION

    steps:
      - name: Checkout generator (main)
        uses: actions/checkout@v4

      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      - name: Checkout the assets branch
        run: |
          git config --global user.name "wot-src build"
          git config --global user.email "actions@users.noreply.github.com"
          git clone --depth 1 --branch "${{ matrix.branch }}" \
            "https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/unicum-gg/wot.assets.git" out

      - name: Generate (no-op if the client version is unchanged)
        run: npm run generate:assets -- --host "${{ matrix.host }}" --guid "${{ matrix.guid }}" --out out

      - name: Commit & push if changed
        working-directory: out
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no changes for ${{ matrix.branch }}"
            exit 0
          fi
          git commit -m "🍱 update ${{ matrix.branch }} icons to $(cat .version_name)"
          git push origin "HEAD:${{ matrix.branch }}"
